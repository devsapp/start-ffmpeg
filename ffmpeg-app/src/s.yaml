edition: 3.0.0
name: ffmpeg-app
access: '{{ access }}'
vars:
  region: '{{ region }}'
  role: '{{ roleArn }}'

resources:
  AudioConvert:
    component: fc3
    props:
      region: ${vars.region}
      functionName: '{{ AudioConvert }}'
      description: 音频格式转换器
      code: ./functions/audio_convert
      runtime: python3.9
      handler: index.handler
      memorySize: 1024
      timeout: 900
      role: ${vars.role}
      logConfig: auto

  GetMediaMeta:
    component: fc3
    props:
      region: ${vars.region}
      functionName: '{{ GetMediaMeta }}'
      description: 获取音视频 meta
      code: ./functions/get_multimedia_meta
      runtime: python3.9
      handler: index.handler
      memorySize: 1024
      timeout: 900
      role: ${vars.role}
      logConfig: auto

  GetDuration:
    component: fc3
    props:
      region: ${vars.region}
      functionName: '{{ GetDuration }}'
      description: 获取音视频时长
      code: ./functions/get_duration
      runtime: python3.9
      handler: index.handler
      memorySize: 1024
      timeout: 900
      role: ${vars.role}
      logConfig: auto
  
  VideoGif:
    component: fc3
    props:
      region: ${vars.region}
      functionName: '{{ VideoGif }}'
      description: 功能强大的 video 提取为 gif 函数
      code: ./functions/video_gif
      runtime: python3.9
      handler: index.handler
      memorySize: 1024
      timeout: 900
      role: ${vars.role}
      logConfig: auto
  
  GetSprites:
    component: fc3
    props:
      region: ${vars.region}
      functionName: '{{ GetSprites }}'
      description: 功能强大雪碧图制作函数
      code: ./functions/get_sprites
      runtime: python3.9
      handler: index.handler
      memorySize: 1024
      timeout: 900
      role: ${vars.role}
      logConfig: auto

  VideoWatermark:
    component: fc3
    props:
      region: ${vars.region}
      functionName: '{{ VideoWatermark }}'
      description: 功能强大的视频添加水印功能
      code: ./functions/video_watermark
      runtime: python3.9
      handler: index.handler
      memorySize: 1024
      timeout: 900
      role: ${vars.role}
      logConfig: auto
