Edition: 3.0.0
Type: Project
Name: HttpPanoramicPageRecording-v3
Version: 0.0.1
Provider:
  - 阿里云
Description: 快速部署一个Http触发的全景web页面录制-高级版应用到阿里云函数计算
HomePage: https://github.com/devsapp/start-ffmpeg/tree/dipper/panoramic-page-recorder
Organization: 阿里云函数计算（FC）
Effective: Public
Tags:
  - 全景录制
Category: 音视频处理
Service:
  函数计算:
    Authorities:
      - AliyunFCFullAccess
  日志服务: 
    Authorities: 
      - AliyunFCServerlessDevsRolePolicy
Parameters:
  type: object
  additionalProperties: false # 不允许增加其他属性
  required: # 必填项
    - region
    - functionNamePrefix
    - roleArn
    - ossBucket
    - timeZone
  properties:
    region:
      title: 部署地域
      type: string
      default: cn-hangzhou
      description: 创建应用所在的地区
      enum:
        - cn-beijing
        - cn-hangzhou
        - cn-shanghai
        - cn-shenzhen
    functionNamePrefix:
      title: 函数名称前缀
      type: string
      default: panoramic-page-${default-suffix}
      pattern: '^[a-zA-Z_][a-zA-Z0-9-_]{0,31}$'
      description: 函数名称前缀，只能包含字母、数字、下划线和中划线。不能以数字、中划线开头。长度在 1-32 之间
    roleArn:
      title: 函数服务角色
      type: string
      default: ''
      pattern: '^acs:ram::[0-9]*:role/.*$'
      description: 函数计算服务配置依赖的角色
      required: true
      x-role:
        name: aliyunfcdefaultrole
        service: fc
        authorities:
          - AliyunFCDefaultRolePolicy
    ossBucket:
      title: OSS 存储桶名
      type: string
      default: ''
      description: OSS 存储桶名
      x-bucket:
        dependency:
          - region
    timeZone:
      title: 时区
      type: string
      default: Asia/Shanghai
      description: 创建的应用函数执行时候所在实例的时区, 详情参考 https://docs.oracle.com/middleware/12211/wcs/tag-ref/MISC/TimeZones.html
