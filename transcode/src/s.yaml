edition: 3.0.0
name: video-transcode
access: '{{ access }}'
vars:
  region: '{{ region }}'
resources:
  VideoTranscoder:
    component: fc3
    props:
      region: ${vars.region}
      functionName: '{{ functionName }}'
      runtime: python3
      handler: index.handler
      memorySize: 8192
      timeout: 7200
      environmentVariables:
        TZ: '{{ timeZone }}'
      internetAccess: true
      role: '{{ roleArn }}'
      code: ./code/transcode
      asyncInvokeConfig:
        maxAsyncEventAgeInSeconds: 18000
        maxAsyncRetryAttempts: 2
        destinationConfig:
          onFailure:
            destination: acs:fc:${this.props.region}::functions/dest-fail
  dest-succ:
    component: fc3
    props:
      region: ${vars.region}
      description: async task destination success function by serverless devs
      runtime: python3
      handler: index.handler
      memorySize: 512
      timeout: 60
      functionName: dest-succ
      code: ./code/succ
  dest-fail:
    component: fc3
    props:
      region: ${vars.region}
      description: async task destination fail function by serverless devs
      runtime: python3
      handler: index.handler
      memorySize: 512
      timeout: 60
      functionName: dest-fail
      code: ./code/fail
