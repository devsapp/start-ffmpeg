edition: 3.0.0
name: multimedia-process-flow
access: '{{ access }}'
vars:
  region: '{{ region }}'
  flowName: '{{ flowName }}'
  role: '{{ functionRoleArn }}'

resources:
  split:
    component: fc3
    props:
      region: ${vars.region}
      handler: index.handler
      timeout: 600
      cpu: 1
      memorySize: 3072
      diskSize: 512
      runtime: python3
      functionName: ${vars.flowName}_split
      role: ${vars.role}
      code: code/split
      vpcConfig: auto
      nasConfig: auto
      logConfig: auto
  
  transcode:
    component: fc3
    props:
      region: ${vars.region}
      handler: index.handler
      timeout: 600
      cpu: 1
      memorySize: 3072
      diskSize: 512
      runtime: python3
      functionName: ${vars.flowName}_transcode
      role: ${vars.role}
      code: code/transcode
      vpcConfig: ${resources.split.output.vpcConfig}
      nasConfig: ${resources.split.output.nasConfig}
      logConfig: ${resources.split.output.logConfig}
    
  merge:
    component: fc3
    props:
      region: ${vars.region}
      handler: index.handler
      timeout: 600
      cpu: 1
      memorySize: 3072
      diskSize: 512
      runtime: python3
      functionName: ${vars.flowName}_merge
      role: ${vars.role}
      code: code/merge
      vpcConfig: ${resources.split.output.vpcConfig}
      nasConfig: ${resources.split.output.nasConfig}
      logConfig: ${resources.split.output.logConfig}

  after-process:
    component: fc3
    props:
      region: ${vars.region}
      handler: index.handler
      timeout: 120
      cpu: 1
      memorySize: 1024
      diskSize: 512
      runtime: python3
      functionName: ${vars.flowName}_after-process
      role: ${vars.role}
      code: code/after-process
      vpcConfig: ${resources.split.output.vpcConfig}
      nasConfig: ${resources.split.output.nasConfig}
      logConfig: ${resources.split.output.logConfig}

  oss-trigger-execute-flow:
    component: fc3
    props:
      region: ${vars.region}
      handler: index.handler
      timeout: 120
      cpu: 1
      memorySize: 1024
      diskSize: 512
      runtime: python3
      environmentVariables:
        OUTPUT_DST: '{{ outputDir }}'
        FLOW_NAME: ${vars.flowName}
        SEG_INTERVAL: '{{ segInterval }}'
        DST_FORMATS: '{{ dstFormats }}'
      functionName: ${vars.flowName}_trigger_execute
      role: ${vars.role}
      code: code/oss-trigger
      logConfig: ${resources.split.output.logConfig}
      triggers:
        - triggerName: ${vars.flowName}
          triggerType: oss
          triggerConfig:
            events:
              - oss:ObjectCreated:PutObject
              - oss:ObjectCreated:PostObject
              - oss:ObjectCreated:CompleteMultipartUpload
            filter:
              key:
                prefix: '{{ prefix }}'
                suffix: ''
          invocationRole: '{{ triggerRoleArn }}'
          sourceArn: acs:oss:${this.props.region}:${config("AccountID")}:{{ ossBucket }}

  multimedia-process-workflow:
    component: flow
    props:
      name: ${vars.flowName}
      region: ${vars.region}
      description: video process flow = split->transcode->merge->${resources.after-process.output.functionName}
      definition: ${yaml(file('code/workflows/multimedia-process-workflow.yml'))}
      roleArn: '{{ fnfRoleArn }}'
